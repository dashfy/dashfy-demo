apis:
  pollInterval: 300000
dashboards:
  - title: GitHub Dashboard
    columns: 4
    rows: 3
    widgets:
      - extension: github
        widget: UserBadge
        x: 0
        y: 0
        columns: 1
        rows: 1
        user: rauchg
      - extension: github
        widget: OrgBadge
        x: 1
        y: 0
        columns: 1
        rows: 1
        organization: vercel
      - extension: github
        widget: RepoBadge
        x: 2
        y: 0
        columns: 1
        rows: 1
        repository: vercel/next.js
      - extension: github
        widget: Status
        x: 3
        y: 0
        columns: 1
        rows: 1
      - extension: github
        widget: CommitActivityLine
        x: 0
        y: 1
        columns: 2
        rows: 1
        repository: vercel/next.js
      - extension: github
        widget: PullRequests
        x: 2
        y: 1
        columns: 2
        rows: 1
        repository: vercel/next.js
        state: open
      - extension: github
        widget: ContributorsStats
        x: 0
        y: 2
        columns: 2
        rows: 1
        repository: vercel/next.js
      - extension: github
        widget: Gitmap
        x: 2
        y: 2
        columns: 2
        rows: 1
        user: rauchg
